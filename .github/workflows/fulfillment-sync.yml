name: Fulfillment Automation

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Run fulfillment automation
        run: node fulfillment-automation.js
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
